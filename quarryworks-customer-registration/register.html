<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | QuarryWorks</title><link rel="stylesheet" href="styles.css"></head><body><div id="loginView"><section class="loginCard"><h1>Quarry<span>Works</span></h1><p class="muted">Customer registration</p><h2>Create your account</h2><form id="registration"><label>Full name<input name="name" autocomplete="name" maxlength="100" required></label><label>Username<input name="username" autocomplete="username" pattern="[A-Za-z0-9_.-]{3,40}" minlength="3" maxlength="40" title="3–40 letters, numbers, dots, underscores or hyphens" required></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><label>Confirm password<input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><button class="primary full">Create customer account</button></form><p id="result" role="status"></p><p class="muted">Manager, Worker and Storekeeper accounts are assigned by the administrator.</p><a href="/">Already registered? Sign in</a></section></div><script>
const f=document.getElementById('registration'),out=document.getElementById('result');
f.onsubmit=async e=>{e.preventDefault();out.textContent='';const data=Object.fromEntries(new FormData(f));if(data.password!==data.confirmPassword){out.textContent='Passwords do not match.';out.className='error';return;}const b=f.querySelector('button');b.disabled=true;try{const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let result;try{result=await r.json();}catch{throw Error('Unexpected server response: '+r.status);}if(!r.ok)throw Error(result.error||'Registration failed');out.className='muted';out.textContent=result.message+' Select Sign in below.';f.reset();}catch(error){out.className='error';out.textContent=error.message;}finally{b.disabled=false;}};
</script></body></html>
